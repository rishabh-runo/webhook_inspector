<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webhook Inspector</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #020617;
            --panel: #0f172a;
            --border: #1e293b;
            --cyan: #22d3ee;
            --green: #22c55e;
            --red: #ef4444;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #020617, #000);
            color: var(--text);
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(8px);
        }

        .title {
            color: var(--cyan);
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .count {
            font-size: 13px;
            font-weight: 600;
            color: var(--cyan);
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
        }

        button {
            background: var(--cyan);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            color: black;
            font-weight: 500;
            cursor: pointer;
        }

        /* ----------- TABS ----------- */
        .tabs {
            display: flex;
            gap: 0;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }

        .tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 16px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 0;
            margin-bottom: -1px;
            transition: color 0.15s;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--cyan);
            border-bottom-color: var(--cyan);
        }

        .tab .path {
            font-size: 11px;
            font-family: monospace;
            opacity: 0.55;
        }

        .tab.active .path {
            opacity: 0.8;
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 7px;
            border-radius: 10px;
            background: rgba(148, 163, 184, 0.12);
            color: var(--muted);
            min-width: 16px;
            text-align: center;
        }

        .tab.active .badge {
            background: var(--cyan);
            color: #000;
        }

        /* ----------- LOGS ----------- */
        #logs {
            padding: 16px;
            max-width: 1100px;
            margin: auto;
        }

        .log {
            border-radius: 12px;
            margin-bottom: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: linear-gradient(145deg, #0f172a, #020617);
            position: relative;
        }

        .log::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0.25;
        }

        .log.get::before {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
        }

        .log.post::before {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
        }

        .log.get {
            border-left: 4px solid #22c55e;
        }

        .log.post {
            border-left: 4px solid #3b82f6;
        }

        .log.error {
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .log-header {
            padding: 14px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .left {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .arrow {
            font-size: 13px;
            color: var(--muted);
        }

        .right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .method {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .method.GET {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .method.POST {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .url {
            font-size: 13px;
        }

        .status {
            font-weight: 700;
            margin-left: 6px;
        }

        .status.success {
            color: #22c55e;
        }

        .status.error {
            color: #ef4444;
        }

        .log-body {
            display: none;
            border-top: 1px solid var(--border);
        }

        .section {
            border-top: 1px solid var(--border);
        }

        .section-header {
            padding: 10px 14px;
            cursor: pointer;
            color: var(--cyan);
        }

        .section-body {
            padding: 10px 14px;
        }

        pre {
            margin: 0;
            font-size: 12px;
            overflow-x: auto;
        }

        .delete {
            cursor: pointer;
            font-size: 16px;
            color: #ef4444;
            padding: 6px;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.1);
            transition: 0.2s;
        }

        .delete:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 60px 0;
            font-size: 14px;
        }

        .empty .endpoint {
            margin-top: 8px;
            font-family: monospace;
            font-size: 13px;
            color: var(--cyan);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="title">⚡ WEBHOOK INSPECTOR</div>
        <div class="actions">
            <div class="count" id="count">0 logs</div>
            <button onclick="clearLogs()">Clear</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-open" onclick="switchChannel('open')">
            open
            <span class="path">/hook/open</span>
            <span class="badge" id="badge-open">0</span>
        </button>
        <button class="tab" id="tab-secure" onclick="switchChannel('secure')">
            secure
            <span class="path">/hook/secure</span>
            <span class="badge" id="badge-secure">0</span>
        </button>
    </div>

    <div id="logs"></div>

    <script>
        const store = { open: [], secure: [] };
        let activeChannel = 'open';

        const logsDiv = document.getElementById('logs');
        const countEl = document.getElementById('count');

        /* Channel switcher */
        function switchChannel(ch) {
            activeChannel = ch;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${ch}`).classList.add('active');
            refresh();
        }

        function updateTabCounts() {
            document.getElementById('badge-open').innerText = store.open.length;
            document.getElementById('badge-secure').innerText = store.secure.length;
        }

        /* Toggle log expand */
        function toggle(el) {
            const body = el.nextElementSibling;
            const arrow = el.querySelector('.arrow');
            const open = body.style.display === 'block';
            body.style.display = open ? 'none' : 'block';
            arrow.innerText = open ? '⯈' : '⯆';
        }

        /* Section toggle */
        function toggleSection(el) {
            const body = el.nextElementSibling;
            body.style.display = body.style.display === 'none' ? 'block' : 'none';
            el.innerText = el.innerText.startsWith('⯈')
                ? el.innerText.replace('⯈', '⯆')
                : el.innerText.replace('⯆', '⯈');
        }

        function safeParse(data) {
            try {
                if (typeof data === 'string') return JSON.parse(data);
                return data;
            } catch {
                return data;
            }
        }

        function section(title, data) {
            return `
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">⯈ ${title}</div>
      <div class="section-body" style="display:none">
        <pre>${JSON.stringify(data, null, 2)}</pre>
      </div>
    </div>`;
        }

        function renderLog(log) {
            const el = document.createElement('div');
            const isError = log.status >= 400;
            el.className = `log ${log.method.toLowerCase()}${isError ? ' error' : ''}`;

            el.innerHTML = `
    <div class="log-header" onclick="toggle(this)">
      <div class="left">
        <div class="arrow">⯈</div>
        <div class="method ${log.method}">${log.method}</div>
        <div class="url">${log.url}</div>
        <div class="status ${isError ? 'error' : 'success'}">${log.status}</div>
      </div>
      <div class="right">
        <div>${new Date(log.time).toLocaleTimeString()}</div>
        <div class="delete" onclick="deleteLog(event, ${log.id})">🗑</div>
      </div>
    </div>
    <div class="log-body">
      ${section('Headers', log.headers)}
      ${section('Query', log.query)}
      ${section('Body', log.body)}
      ${section('Response', safeParse(log.response))}
    </div>`;

            return el;
        }

        function refresh() {
            const logs = store[activeChannel];
            logsDiv.innerHTML = '';

            if (logs.length === 0) {
                const endpointMap = { open: '/hook/open', secure: '/hook/secure' };
                logsDiv.innerHTML = `
          <div class="empty">
            No requests captured yet.
            <div class="endpoint">POST ${endpointMap[activeChannel]}</div>
          </div>`;
            } else {
                logs.forEach(l => logsDiv.appendChild(renderLog(l)));
            }

            countEl.innerText = logs.length + ' logs';
            updateTabCounts();
        }

        function deleteLog(e, id) {
            e.stopPropagation();
            fetch(`/logs/${activeChannel}/${id}`, { method: 'DELETE' });
        }

        function clearLogs() {
            fetch(`/logs/${activeChannel}`, { method: 'DELETE' });
        }

        /* Init — fetch both channels */
        Promise.all([
            fetch('/logs/open').then(r => r.json()),
            fetch('/logs/secure').then(r => r.json())
        ]).then(([open, secure]) => {
            store.open = open.reverse();
            store.secure = secure.reverse();
            refresh();
        });

        /* WebSocket */
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${protocol}://${location.host}`);

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);

            if (msg.type === 'NEW_LOG') {
                store[msg.channel].unshift(msg.data);
                if (msg.channel === activeChannel) refresh();
                else updateTabCounts();
            }

            if (msg.type === 'CLEAR_LOGS') {
                store[msg.channel] = [];
                if (msg.channel === activeChannel) refresh();
                else updateTabCounts();
            }

            if (msg.type === 'DELETE_LOG') {
                store[msg.channel] = store[msg.channel].filter(l => l.id !== msg.id);
                if (msg.channel === activeChannel) refresh();
                else updateTabCounts();
            }
        };
    </script>

</body>

</html>
